# Stop after the first failing hook (skip pytest when ruff/format/etc. fail).
fail_fast: true

repos:
  # ------------------------------------
  # Patch version bump (every commit)
  # ------------------------------------
  - repo: local
    hooks:
      - id: bump-patch-version
        name: Bump patch version
        entry: "python scripts/development/bump_patch_version.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]

  # ------------------------------------
  # Generate requirements.txt if needed
  # ------------------------------------
  - repo: local
    hooks:
      - id: requirements.txt
        name: Create requirements.txt
        entry: "python scripts/development/$check_poetry_to_requirements.py"
        language: system
        # Only Poetry inputs matter; hook ignores argv and uses staged files.
        # Do not match all Python files: pre-commit runs those invocations in
        # parallel and each one called `git add`, causing index.lock races.
        files: ^(pyproject\.toml|poetry\.lock)$
        pass_filenames: false
        require_serial: true

  # ------------------------------------
  # scripts/*.py, scripts/*.sh (not /scriptsdevelopment/), and root *.sh executable in git
  # ------------------------------------
  - repo: local
    hooks:
      - id: ensure-scripts-executable
        name: Ensure scripts are executable in git
        entry: "python scripts/development/ensure_scripts_executable.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]

  # ------------------------------------
  # General repo hygiene
  # ------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  # ------------------------------------
  # Run local installed tools
  # ------------------------------------
  - repo: local
    hooks:
      # ------------------------------------
      # Ruff (format + lint)
      # ------------------------------------
      - id: ruff-format
        name: Ruff format check
        entry: "poetry run ruff"
        args: ["format", "--check", "--diff"]
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff
        name: Ruff lint check
        entry: "poetry run ruff"
        args: ["check"]
        language: system
        types: [python]
        pass_filenames: true

      - id: pytest
        name: Run Pytest
        entry: "poetry run pytest"
        args: ["--maxfail=1", "--disable-warnings"]
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]

  # ------------------------------------
  # Pre-push: minor bump on hash change
  # ------------------------------------
  - repo: local
    hooks:
      - id: bump-minor-on-hash-change
        name: Bump minor version on compatibility hash change
        entry: "python scripts/development/bump_minor_on_hash_change.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
